# Local patched copy of kaggle-mcp-server 0.2.0 (https://github.com/Galaxy-Dawn/kaggle-mcp, MIT).
# Changes: discussion_detail / discussion_comments fetch by topic ID (see PATCHES.md); mcp pinned < 2.
[project]
name = "kaggle-mcp-server"
version = "0.2.0+local.1"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "kaggle>=2.2",
    "mcp[cli]>=1.0,<2",
]

[project.scripts]
kaggle-mcp-server = "kaggle_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kaggle_mcp"]
